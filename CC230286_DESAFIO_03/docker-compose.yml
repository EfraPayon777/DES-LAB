services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Admin123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  api:
    build:
      context: .
    image: desafio03-api:latest
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=db;Database=CC230286_Desafio03Db;User Id=sa;Password=Admin123!;Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True;"
    depends_on:
      - db

volumes:
  sqlserver-data: